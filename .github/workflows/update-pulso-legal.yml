name: Update Pulso Legal

on:
  schedule:
    # Ventana matutina de prueba: 06:30 a 09:30, hora de México.
    - cron: '30 12 * * 1-5'
    - cron: '0,30 13-15 * * 1-5'
    # Ventana vespertina de prueba: 16:30 a 20:30, hora de México.
    - cron: '30 22 * * 1-5'
    - cron: '0,30 23 * * 1-5'
    - cron: '0,30 0-2 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pulso-legal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update Pulso Legal data
        run: node scripts/update-pulso-legal.mjs
        env:
          PULSO_LEGAL_PRINT_ITEMS: '1'

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pulso-legal.json
          git diff --cached --quiet || git commit -m "Update Pulso Legal feed"
          git push
